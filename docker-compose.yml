services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops_user
      POSTGRES_PASSWORD: flowops_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops_user -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
